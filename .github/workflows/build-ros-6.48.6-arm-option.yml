name: Build option-6.48.6-arm only

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate
        env:
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -f npk.py
          test -n "${CUSTOM_NPK_SIGN_PRIVATE_KEY}"
          test -n "${CUSTOM_LICENSE_PRIVATE_KEY}"
          python3 -m py_compile npk.py
          # 确认有 create
          python3 npk.py 2>&1 | head -5 || true

      - name: Build option only
        env:
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
          CUSTOM_NPK_SIGN_PUBLIC_KEY: "9BA63F05E55C293AFA9D961F9C43675D990252A158358986F5BB699700014709"
          CUSTOM_LICENSE_PUBLIC_KEY: "52AC2A5C0DC7D1405E96EA6965A17BAA13C2A6EA010A567B9216A3A6F7970462"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools

          VERSION="6.48.6"
          ARCH="arm"
          WORK="$PWD/build"
          OUT="$PWD/output"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/pkgs" "$WORK/option-root/bin" "$OUT"

          # 只下载 all_packages 当模板（用 gps/ntp 等小包）
          wget --retry-connrefused --waitretry=5 --tries=5 --timeout=60 --show-progress \
            -O "$WORK/all_packages-${ARCH}-${VERSION}.zip" \
            "https://download.mikrotik.com/routeros/${VERSION}/all_packages-${ARCH}-${VERSION}.zip"
          unzip -o "$WORK/all_packages-${ARCH}-${VERSION}.zip" -d "$WORK/pkgs/"
          chmod -R u+w "$WORK/pkgs"
          ls -lh "$WORK/pkgs/"

          # arm busybox / keygen（elseif 历史提交）
          wget -nv -O "$WORK/busybox_arm" \
            "https://raw.githubusercontent.com/elseif/MikroTikPatch/ee6d299e/busybox/busybox_arm"
          wget -nv -O "$WORK/keygen_arm" \
            "https://raw.githubusercontent.com/elseif/MikroTikPatch/ee6d299e/keygen/keygen_arm" || true
          chmod +x "$WORK/busybox_arm"
          file "$WORK/busybox_arm" || true
          # 必须是 ARM 32-bit ELF
          file "$WORK/busybox_arm" | grep -qi "ARM\|32-bit" || {
            echo "ERROR: busybox_arm is not ARM binary"
            file "$WORK/busybox_arm"
            exit 1
          }

          cp "$WORK/busybox_arm" "$WORK/option-root/bin/busybox"
          chmod +x "$WORK/option-root/bin/busybox"
          if [ -s "$WORK/keygen_arm" ]; then
            cp "$WORK/keygen_arm" "$WORK/option-root/bin/keygen"
            chmod +x "$WORK/option-root/bin/keygen"
          fi

          # 命令软链（用 x86 busybox --list 仅取名字）
          wget -nv -O "$WORK/busybox_x86" \
            "https://raw.githubusercontent.com/elseif/MikroTikPatch/main/busybox/busybox_x86" || true
          COMMANDS=""
          if [ -x "$WORK/busybox_x86" ]; then
            chmod +x "$WORK/busybox_x86"
            COMMANDS=$("$WORK/busybox_x86" --list 2>/dev/null || true)
          fi
          if [ -z "$COMMANDS" ]; then
            COMMANDS="sh ash ls cat cp mv rm mkdir echo grep find vi tar gzip wget head tail free df ps kill"
          fi
          for cmd in $COMMANDS; do
            ln -sf /pckg/option/bin/busybox "$WORK/option-root/bin/$cmd"
          done

          mksquashfs "$WORK/option-root" "$WORK/option.sfs" \
            -no-recovery -noappend -exit-on-error -quiet -comp xz -no-xattrs -b 256k -all-root
          ls -lh "$WORK/option.sfs"

          # 模板：优先 gps，否则任意非 system 小包
          TEMPLATE=""
          for cand in \
            "$WORK/pkgs/gps-${VERSION}-${ARCH}.npk" \
            "$WORK/pkgs/ntp-${VERSION}-${ARCH}.npk" \
            "$WORK/pkgs/ups-${VERSION}-${ARCH}.npk"
          do
            [ -f "$cand" ] && TEMPLATE="$cand" && break
          done
          if [ -z "$TEMPLATE" ]; then
            TEMPLATE=$(ls "$WORK"/pkgs/*.npk | grep -vE 'system|routeros' | head -1)
          fi
          echo "template: $TEMPLATE"
          test -f "$TEMPLATE"

          OPTION_NPK="$OUT/option-${VERSION}-${ARCH}.npk"
          python3 npk.py create "$TEMPLATE" "$OPTION_NPK" option "$WORK/option.sfs" -desc="busybox"
          # create 里已签名；再签一次确保一致
          python3 npk.py sign "$OPTION_NPK" "$OPTION_NPK"

          ls -lh "$OPTION_NPK"
          echo "OK: option package ready"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: option-6.48.6-arm
          path: output/option-6.48.6-arm.npk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.48.6-arm-option-${{ github.run_id }}
          name: option-6.48.6-arm only
          body: |
            Standalone option package for existing patched RouterOS 6.48.6 arm.
            Does NOT modify main routeros package.

            Install on a running system:
            1. Upload option-6.48.6-arm.npk via WinBox/Files
            2. System → Packages → enable / reboot once
            3. /system/shell  or ssh devel@router

            Do NOT Netinstall option alone as main OS package.
          files: |
            output/option-6.48.6-arm.npk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
