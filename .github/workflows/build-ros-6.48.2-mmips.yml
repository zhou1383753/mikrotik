name: Build and Release RouterOS 6.48.2 mmips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate
        env:
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -f patch.py
          test -f npk.py
          test -n "${CUSTOM_NPK_SIGN_PRIVATE_KEY}"
          test -n "${CUSTOM_LICENSE_PRIVATE_KEY}"
          python3 -m py_compile patch.py npk.py

      - name: Fix patch.py (keep xz size safe for ELF)
        run: |
          set -euo pipefail
          python3 -c "
          from pathlib import Path
          p = Path('patch.py')
          t = p.read_text(encoding='utf-8')

          start = t.find('def patch_initrd_xz(')
          end = t.find('\ndef find_7zXZ_data(', start)
          if start < 0 or end < 0:
              raise SystemExit('patch_initrd_xz block not found')

          new_fn = '''def patch_initrd_xz(initrd_xz:bytes,key_dict:dict,ljust=True):
      initrd = lzma.decompress(initrd_xz)
      new_initrd = initrd
      for old_public_key,new_public_key in key_dict.items():
          if old_public_key in new_initrd:
              print(f'initrd public key patched {old_public_key[:16].hex().upper()}...')
              new_initrd = new_initrd.replace(old_public_key,new_public_key)

      candidates = []
      trials = [
          (9 | lzma.PRESET_EXTREME, 32*1024*1024, 3, 0, 2),
          (9 | lzma.PRESET_EXTREME, 16*1024*1024, 3, 0, 2),
          (9 | lzma.PRESET_EXTREME, 8*1024*1024, 3, 0, 2),
          (9 | lzma.PRESET_EXTREME, 4*1024*1024, 3, 0, 2),
          (9 | lzma.PRESET_EXTREME, 2*1024*1024, 3, 0, 2),
          (9, 8*1024*1024, 3, 0, 2),
          (9, 4*1024*1024, 3, 0, 2),
          (9, None, None, None, None),
          (7, None, None, None, None),
          (6, None, None, None, None),
      ]
      for preset, dict_size, lc, lp, pb in trials:
          filt = {'id': lzma.FILTER_LZMA2, 'preset': preset}
          if dict_size is not None:
              filt['dict_size'] = dict_size
          if lc is not None:
              filt['lc'] = lc
              filt['lp'] = lp
              filt['pb'] = pb
          try:
              out = lzma.compress(new_initrd, check=lzma.CHECK_CRC32, filters=[filt])
              candidates.append(out)
          except Exception as e:
              print('compress trial failed:', e)

      if not candidates:
          print('WARNING: no compress candidate, keep original initrd xz')
          return initrd_xz

      new_initrd_xz = min(candidates, key=len)
      print(f'new initrd xz size:{len(new_initrd_xz)}')
      print(f'old initrd xz size:{len(initrd_xz)}')

      if len(new_initrd_xz) > len(initrd_xz):
          # 关键：宁可跳过内核 initrd 公钥替换，也不要把 ELF 撑破导致重启循环
          print('WARNING: compressed initrd still larger; SKIP kernel initrd key patch to keep device bootable')
          return initrd_xz

      if ljust:
          print(f'ljust size:{len(initrd_xz)-len(new_initrd_xz)}')
          new_initrd_xz = new_initrd_xz.ljust(len(initrd_xz), b'\\x00')
      return new_initrd_xz

'''
          t = t[:start] + new_fn + t[end:]
          p.write_text(t, encoding='utf-8')
          print('patch_initrd_xz replaced')
          "
          python3 -m py_compile patch.py

      - name: Build mmips packages
        env:
          MIKRO_NPK_SIGN_PUBLIC_KEY: "C293CED638A2A33C681FC8DE98EE26C54EADC5390C2DFCE197D35C83C416CF59"
          MIKRO_NPK_SIGN_PUBLIC_LKEY: "C293CED638A2A33C681FC8DE98EE26C54EADC5390C2DFCE197D35C83C416CF59"
          MIKRO_LICENSE_PUBLIC_KEY: "8E1067E4305FCDC0CFBF95C10F96E5DFE8C49AEF486BD1A4E2E96C27F01E3E32"
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          CUSTOM_NPK_SIGN_PUBLIC_KEY: "9BA63F05E55C293AFA9D961F9C43675D990252A158358986F5BB699700014709"
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
          CUSTOM_LICENSE_PUBLIC_KEY: "52AC2A5C0DC7D1405E96EA6965A17BAA13C2A6EA010A567B9216A3A6F7970462"
          MIKRO_UPGRADE_URL: "https://upgrade.mikrotik.com/"
          CUSTOM_UPGRADE_URL: "http://127.0.0.1/my_custom_upgrade/"
        run: |
          set -euo pipefail
          VERSION="6.48.2"
          ARCH="mmips"
          WORK="$PWD/build"
          OUT="$PWD/output"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/pkgs" "$OUT"

          wget --retry-connrefused --waitretry=5 --tries=5 --timeout=60 --show-progress \
            -O "$WORK/routeros-${ARCH}-${VERSION}.npk" \
            "https://download.mikrotik.com/routeros/${VERSION}/routeros-${ARCH}-${VERSION}.npk"
          wget --retry-connrefused --waitretry=5 --tries=5 --timeout=60 --show-progress \
            -O "$WORK/all_packages-${ARCH}-${VERSION}.zip" \
            "https://download.mikrotik.com/routeros/${VERSION}/all_packages-${ARCH}-${VERSION}.zip"

          unzip -o "$WORK/all_packages-${ARCH}-${VERSION}.zip" -d "$WORK/pkgs/"
          chmod -R u+w "$WORK/pkgs" "$WORK/routeros-${ARCH}-${VERSION}.npk"
          cp -f "$WORK/routeros-${ARCH}-${VERSION}.npk" "$WORK/pkgs/routeros-${ARCH}-${VERSION}.npk"

          for f in "$WORK"/pkgs/*.npk; do
            echo "[Processing NPK]: $f"
            python3 patch.py npk "$f"
            python3 npk.py sign "$f" "$f"
          done

          cp -f "$WORK/pkgs/routeros-${ARCH}-${VERSION}.npk" "$OUT/routeros-${ARCH}-${VERSION}.npk"
          (cd "$WORK/pkgs" && zip -r "$OUT/all_packages-${ARCH}-${VERSION}.zip" ./*.npk)
          ls -lh "$OUT/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RouterOS-6.48.2-Patched-mmips
          path: output/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.48.2-mmips-patched-${{ github.run_id }}
          name: RouterOS 6.48.2 stable mmips
          body: |
            RouterOS 6.48.2 mmips patched (boot-safe).
            - If kernel initrd xz cannot shrink, kernel key patch is skipped to avoid reboot loop
            - Squashfs keys + NPK re-sign still applied

            Assets:
            - routeros-mmips-6.48.2.npk
            - all_packages-mmips-6.48.2.zip
          files: |
            output/routeros-mmips-6.48.2.npk
            output/all_packages-mmips-6.48.2.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
