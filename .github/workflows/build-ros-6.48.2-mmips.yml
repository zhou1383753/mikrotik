name: Build and Release RouterOS 6.48.2 mmips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate build environment
        env:
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -f patch.py
          test -f npk.py
          test -n "$CUSTOM_NPK_SIGN_PRIVATE_KEY" || { echo "ERROR: missing CUSTOM_NPK_SIGN_PRIVATE_KEY"; exit 1; }
          test -n "$CUSTOM_LICENSE_PRIVATE_KEY" || { echo "ERROR: missing CUSTOM_LICENSE_PRIVATE_KEY"; exit 1; }
          python3 -m py_compile patch.py npk.py

      - name: Fix patch.py for mmips initrd size
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("patch.py")
          text = path.read_text(encoding="utf-8")

          start = text.find("def patch_initrd_xz(")
          if start < 0:
              raise SystemExit("ERROR: def patch_initrd_xz not found")
          end = text.find("\ndef find_7zXZ_data(", start)
          if end < 0:
              raise SystemExit("ERROR: find_7zXZ_data not found after patch_initrd_xz")

          new_fn = '''def patch_initrd_xz(initrd_xz:bytes,key_dict:dict,ljust=True):
      initrd = lzma.decompress(initrd_xz)
      new_initrd = initrd
      for old_public_key,new_public_key in key_dict.items():
          if old_public_key in new_initrd:
              print(f'initrd public key patched {old_public_key[:16].hex().upper()}...')
              new_initrd = new_initrd.replace(old_public_key,new_public_key)

      candidates = []
      # try several compress settings; pick the smallest result
      for preset, dict_size, lc, lp, pb in [
          (9 | lzma.PRESET_EXTREME, 32*1024*1024, 3, 0, 2),
          (9 | lzma.PRESET_EXTREME, 16*1024*1024, 3, 0, 2),
          (9 | lzma.PRESET_EXTREME, 8*1024*1024, 3, 0, 2),
          (9 | lzma.PRESET_EXTREME, 4*1024*1024, 3, 0, 2),
          (9, 8*1024*1024, 3, 0, 2),
          (9, None, None, None, None),
      ]:
          filters = [{"id": lzma.FILTER_LZMA2, "preset": preset}]
          if dict_size is not None:
              filters[0]["dict_size"] = dict_size
          if lc is not None:
              filters[0]["lc"] = lc
              filters[0]["lp"] = lp
              filters[0]["pb"] = pb
          try:
              out = lzma.compress(new_initrd, check=lzma.CHECK_CRC32, filters=filters)
              candidates.append(out)
          except Exception as e:
              print(f"compress candidate failed: {e}")

      if not candidates:
          raise RuntimeError("all compress candidates failed")

      new_initrd_xz = min(candidates, key=len)
      print(f'new initrd xz size:{len(new_initrd_xz)}')
      print(f'old initrd xz size:{len(initrd_xz)}')

      if ljust:
          if len(new_initrd_xz) > len(initrd_xz):
              raise AssertionError(
                  f"new initrd xz size is too big: new={len(new_initrd_xz)} old={len(initrd_xz)}"
              )
          print(f'ljust size:{len(initrd_xz)-len(new_initrd_xz)}')
          new_initrd_xz = new_initrd_xz.ljust(len(initrd_xz), b'\\0')
      return new_initrd_xz

'''
          text = text[:start] + new_fn + text[end:]
          path.write_text(text, encoding="utf-8")
          print("patch_initrd_xz replaced OK")
          PY
          python3 -m py_compile patch.py
          echo "patch.py ready"

      - name: Download, Patch & Build RouterOS 6.48.2 mmips
        env:
          MIKRO_NPK_SIGN_PUBLIC_KEY: "C293CED638A2A33C681FC8DE98EE26C54EADC5390C2DFCE197D35C83C416CF59"
          MIKRO_NPK_SIGN_PUBLIC_LKEY: "C293CED638A2A33C681FC8DE98EE26C54EADC5390C2DFCE197D35C83C416CF59"
          MIKRO_LICENSE_PUBLIC_KEY: "8E1067E4305FCDC0CFBF95C10F96E5DFE8C49AEF486BD1A4E2E96C27F01E3E32"
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          CUSTOM_NPK_SIGN_PUBLIC_KEY: "9BA63F05E55C293AFA9D961F9C43675D990252A158358986F5BB699700014709"
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
          CUSTOM_LICENSE_PUBLIC_KEY: "52AC2A5C0DC7D1405E96EA6965A17BAA13C2A6EA010A567B9216A3A6F7970462"
          MIKRO_UPGRADE_URL: "https://upgrade.mikrotik.com/"
          CUSTOM_UPGRADE_URL: "http://127.0.0.1/my_custom_upgrade/"
        run: |
          set -euo pipefail

          VERSION="6.48.2"
          ARCH="mmips"
          WORK="$PWD/build"
          OUT="$PWD/output"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/pkgs" "$OUT"

          echo "=== 1. Download official mmips packages ==="
          wget --retry-connrefused --waitretry=5 --tries=5 --timeout=60 --show-progress \
            -O "$WORK/routeros-${ARCH}-${VERSION}.npk" \
            "https://download.mikrotik.com/routeros/${VERSION}/routeros-${ARCH}-${VERSION}.npk"
          wget --retry-connrefused --waitretry=5 --tries=5 --timeout=60 --show-progress \
            -O "$WORK/all_packages-${ARCH}-${VERSION}.zip" \
            "https://download.mikrotik.com/routeros/${VERSION}/all_packages-${ARCH}-${VERSION}.zip"

          test -s "$WORK/routeros-${ARCH}-${VERSION}.npk"
          test -s "$WORK/all_packages-${ARCH}-${VERSION}.zip"

          echo "=== 2. Extract all packages ==="
          unzip -o "$WORK/all_packages-${ARCH}-${VERSION}.zip" -d "$WORK/pkgs/"
          chmod -R u+w "$WORK/pkgs" "$WORK/routeros-${ARCH}-${VERSION}.npk"
          cp -f "$WORK/routeros-${ARCH}-${VERSION}.npk" "$WORK/pkgs/routeros-${ARCH}-${VERSION}.npk"
          ls -lh "$WORK/pkgs/"

          echo "=== 3. Patch & re-sign all NPK files ==="
          shopt -s nullglob
          npk_files=("$WORK"/pkgs/*.npk)
          test "${#npk_files[@]}" -gt 0

          for f in "${npk_files[@]}"; do
            echo "[Processing NPK]: $f"
            python3 patch.py npk "$f"
            python3 npk.py sign "$f" "$f"
          done

          cp -f "$WORK/pkgs/routeros-${ARCH}-${VERSION}.npk" "$WORK/routeros-${ARCH}-${VERSION}.npk"

          echo "=== 4. Package outputs ==="
          cp -f "$WORK/routeros-${ARCH}-${VERSION}.npk" "$OUT/routeros-${ARCH}-${VERSION}.npk"
          (cd "$WORK/pkgs" && zip -r "$OUT/all_packages-${ARCH}-${VERSION}.zip" ./*.npk)

          echo "=== 5. Verify ==="
          test -s "$OUT/routeros-${ARCH}-${VERSION}.npk"
          test -s "$OUT/all_packages-${ARCH}-${VERSION}.zip"
          ls -lh "$OUT/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RouterOS-6.48.2-Patched-mmips
          path: output/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.48.2-mmips-patched-${{ github.run_id }}
          name: RouterOS 6.48.2 stable mmips
          body: |
            RouterOS 6.48.2 mmips patched release.

            Assets:
            - routeros-mmips-6.48.2.npk
            - all_packages-mmips-6.48.2.zip

            License public key:
            52AC2A5C0DC7D1405E96EA6965A17BAA13C2A6EA010A567B9216A3A6F7970462

            Workflow run: ${{ github.run_id }}
          files: |
            output/routeros-mmips-6.48.2.npk
            output/all_packages-mmips-6.48.2.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
