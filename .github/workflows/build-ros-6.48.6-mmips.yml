name: Build and Release RouterOS 6.48.6 mmips

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate
        env:
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -f patch.py
          test -f npk.py
          test -n "${CUSTOM_NPK_SIGN_PRIVATE_KEY}"
          test -n "${CUSTOM_LICENSE_PRIVATE_KEY}"
          python3 -m py_compile patch.py npk.py

      - name: Fix patch.py (Python lzma only)
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("patch.py")
          t = p.read_text(encoding="utf-8")
          start = t.find("def patch_initrd_xz(")
          end = t.find("\ndef find_7zXZ_data(", start)
          if start < 0 or end < 0:
              raise SystemExit("patch_initrd_xz not found")
          new_fn = (
              "def patch_initrd_xz(initrd_xz:bytes,key_dict:dict,ljust=True):\n"
              "    initrd = lzma.decompress(initrd_xz)\n"
              "    new_initrd = initrd\n"
              "    for old_public_key,new_public_key in key_dict.items():\n"
              "        if old_public_key in new_initrd:\n"
              "            print(f'initrd public key patched {old_public_key[:16].hex().upper()}...')\n"
              "            new_initrd = new_initrd.replace(old_public_key,new_public_key)\n"
              "    candidates = []\n"
              "    trials = [\n"
              "        (9 | lzma.PRESET_EXTREME, 32*1024*1024, 4, 0, 0),\n"
              "        (9 | lzma.PRESET_EXTREME, 32*1024*1024, 3, 0, 2),\n"
              "        (9 | lzma.PRESET_EXTREME, 16*1024*1024, 3, 0, 2),\n"
              "        (9 | lzma.PRESET_EXTREME, 8*1024*1024, 3, 0, 2),\n"
              "        (9 | lzma.PRESET_EXTREME, 4*1024*1024, 3, 0, 2),\n"
              "        (9, 8*1024*1024, 3, 0, 2),\n"
              "        (9, None, None, None, None),\n"
              "        (8, None, None, None, None),\n"
              "        (7, None, None, None, None),\n"
              "        (6, None, None, None, None),\n"
              "    ]\n"
              "    for preset, dict_size, lc, lp, pb in trials:\n"
              "        filt = {'id': lzma.FILTER_LZMA2, 'preset': preset}\n"
              "        if dict_size is not None:\n"
              "            filt['dict_size'] = dict_size\n"
              "        if lc is not None:\n"
              "            filt['lc'] = lc\n"
              "            filt['lp'] = lp\n"
              "            filt['pb'] = pb\n"
              "        try:\n"
              "            out = lzma.compress(new_initrd, check=lzma.CHECK_CRC32, filters=[filt])\n"
              "            candidates.append(out)\n"
              "            print(f'trial size={len(out)}')\n"
              "        except Exception as e:\n"
              "            print('trial failed:', e)\n"
              "    if not candidates:\n"
              "        raise RuntimeError('no compress candidates')\n"
              "    new_initrd_xz = min(candidates, key=len)\n"
              "    print(f'new initrd xz size:{len(new_initrd_xz)}')\n"
              "    print(f'old initrd xz size:{len(initrd_xz)}')\n"
              "    if len(new_initrd_xz) > len(initrd_xz):\n"
              "        raise AssertionError(\n"
              "            f'new initrd xz size is too big: new={len(new_initrd_xz)} old={len(initrd_xz)}'\n"
              "        )\n"
              "    if ljust:\n"
              "        print(f'ljust size:{len(initrd_xz)-len(new_initrd_xz)}')\n"
              "        new_initrd_xz = new_initrd_xz.ljust(len(initrd_xz), bytes([0]))\n"
              "    return new_initrd_xz\n"
              "\n"
          )
          t = t[:start] + new_fn + t[end:]
          p.write_text(t, encoding="utf-8")
          print("patch_initrd_xz replaced OK")
          PY
          python3 -m py_compile patch.py

      - name: Build mmips packages
        env:
          MIKRO_NPK_SIGN_PUBLIC_KEY: "C293CED638A2A33C681FC8DE98EE26C54EADC5390C2DFCE197D35C83C416CF59"
          MIKRO_NPK_SIGN_PUBLIC_LKEY: "C293CED638A2A33C681FC8DE98EE26C54EADC5390C2DFCE197D35C83C416CF59"
          MIKRO_LICENSE_PUBLIC_KEY: "8E1067E4305FCDC0CFBF95C10F96E5DFE8C49AEF486BD1A4E2E96C27F01E3E32"
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          CUSTOM_NPK_SIGN_PUBLIC_KEY: "9BA63F05E55C293AFA9D961F9C43675D990252A158358986F5BB699700014709"
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
          CUSTOM_LICENSE_PUBLIC_KEY: "52AC2A5C0DC7D1405E96EA6965A17BAA13C2A6EA010A567B9216A3A6F7970462"
          MIKRO_UPGRADE_URL: "https://upgrade.mikrotik.com/"
          CUSTOM_UPGRADE_URL: "http://127.0.0.1/my_custom_upgrade/"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools

          VERSION="6.48.6"
          ARCH="mmips"
          WORK="$PWD/build"
          OUT="$PWD/output"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/pkgs" "$OUT"

          wget --retry-connrefused --waitretry=5 --tries=5 --timeout=60 --show-progress \
            -O "$WORK/routeros-${ARCH}-${VERSION}.npk" \
            "https://download.mikrotik.com/routeros/${VERSION}/routeros-${ARCH}-${VERSION}.npk"
          wget --retry-connrefused --waitretry=5 --tries=5 --timeout=60 --show-progress \
            -O "$WORK/all_packages-${ARCH}-${VERSION}.zip" \
            "https://download.mikrotik.com/routeros/${VERSION}/all_packages-${ARCH}-${VERSION}.zip"

          # 保留原始完整 routeros（约 10MB）供注入
          cp -f "$WORK/routeros-${ARCH}-${VERSION}.npk" "$WORK/routeros-${ARCH}-${VERSION}.npk.orig"
          echo "Original routeros size: $(stat -c%s "$WORK/routeros-${ARCH}-${VERSION}.npk.orig") bytes"

          unzip -o "$WORK/all_packages-${ARCH}-${VERSION}.zip" -d "$WORK/pkgs/"
          chmod -R u+w "$WORK/pkgs"
          ls -lh "$WORK/pkgs/"

          # 1) patch all_packages 里每个包（含 system）；跳过单独的 routeros 文件若存在
          for f in "$WORK"/pkgs/*.npk; do
            base=$(basename "$f")
            if [[ "$base" == routeros-* ]]; then
              echo "[SKIP standalone]: $base"
              continue
            fi
            echo "[Processing NPK]: $f"
            python3 patch.py npk "$f"
            python3 npk.py sign "$f" "$f"
          done

          SYSTEM_NPK="$WORK/pkgs/system-${VERSION}-${ARCH}.npk"
          if [ ! -f "$SYSTEM_NPK" ]; then
            echo "ERROR: system package not found"
            ls -la "$WORK/pkgs/"
            exit 1
          fi
          echo "Patched system size: $(stat -c%s "$SYSTEM_NPK") bytes"

          # 2) 把已 patch 的 system 注入到完整 routeros 多包中，再整体签名
          python3 << 'PY'
          import os
          from pathlib import Path
          from npk import NovaPackage, NpkPartID, Package, NpkPartItem

          version = "6.48.6"
          arch = "mmips"
          work = Path("build")
          system_path = work / "pkgs" / f"system-{version}-{arch}.npk"
          ros_orig = work / f"routeros-{arch}-{version}.npk.orig"
          ros_out = work / f"routeros-{arch}-{version}.npk"

          sys_npk = NovaPackage.load(str(system_path))
          ros_npk = NovaPackage.load(str(ros_orig))

          print(f"system is multi-package: {len(sys_npk._packages) > 0}")
          print(f"routeros subpackages: {len(ros_npk._packages)}")
          assert len(sys_npk._packages) == 0, "expected single system package"
          assert len(ros_npk._packages) > 0, "expected multi-package routeros"

          replaced = False
          for i, pkg in enumerate(ros_npk._packages):
              name = pkg[NpkPartID.NAME_INFO].data.name
              print(f"  subpackage[{i}]: {name}")
              if name == "system":
                  new_pkg = Package()
                  for part in sys_npk._parts:
                      new_pkg._parts.append(NpkPartItem(part.id, part.data))
                  ros_npk._packages[i] = new_pkg
                  replaced = True
                  print("  -> replaced with patched system")

          if not replaced:
              raise SystemExit("system subpackage not found inside routeros")

          kcdsa = bytes.fromhex(os.environ["CUSTOM_LICENSE_PRIVATE_KEY"])
          eddsa = bytes.fromhex(os.environ["CUSTOM_NPK_SIGN_PRIVATE_KEY"])
          ros_npk.sign(kcdsa, eddsa)
          ros_npk.save(str(ros_out))

          size = ros_out.stat().st_size
          print(f"Final routeros size: {size} bytes ({size/1024/1024:.2f} MB)")
          if size < 8_000_000:
              raise SystemExit(f"ERROR: routeros too small ({size}), expected ~10MB")
          print("OK: full routeros package built")
          PY

          cp -f "$WORK/routeros-${ARCH}-${VERSION}.npk" "$OUT/routeros-${ARCH}-${VERSION}.npk"
          cp -f "$SYSTEM_NPK" "$OUT/system-${VERSION}-${ARCH}.npk"
          (cd "$WORK/pkgs" && zip -r "$OUT/all_packages-${ARCH}-${VERSION}.zip" ./*.npk)

          echo "=== outputs ==="
          ls -lh "$OUT/"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RouterOS-6.48.6-Patched-mmips
          path: output/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.48.6-mmips-patched-${{ github.run_id }}
          name: RouterOS 6.48.6 stable mmips
          body: |
            Full routeros-mmips package (~10MB) with patched system injected.

            Netinstall: use ONLY routeros-mmips-6.48.6.npk
            Do not use system-*.npk alone as install image.
          files: |
            output/routeros-mmips-6.48.6.npk
            output/system-6.48.6-mmips.npk
            output/all_packages-mmips-6.48.6.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
