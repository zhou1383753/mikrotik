name: Build and Release RouterOS 7.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget zip unzip p7zip-full

      - name: Download & Patch RouterOS 7.5 Install IMG
        run: |
          mkdir -p output

          # 1. 下载官方 x86 Install Image 压缩包
          wget -q https://download.mikrotik.com/routeros/7.5/install-image-7.5.zip
          unzip -o install-image-7.5.zip

          # 2. 找到解压出的 .img 文件
          IMG_FILE=$(ls install-image-*.img 2>/dev/null | head -n 1)
          if [ -z "$IMG_FILE" ]; then
            IMG_FILE="install-image-7.5.img"
          fi

          # 3. 如果仓库中有 patch.py，执行修补
          if [ -f "patch.py" ]; then
            python3 patch.py "$IMG_FILE" || python3 patch.py netinstall "$IMG_FILE" || true
          fi

          # 4. 重新打包为 install-image-7.5.zip
          zip -j output/install-image-7.5.zip "$IMG_FILE"

          # 5. 同步下载 x86 扩展软件包 (all_packages)
          wget -q https://download.mikrotik.com/routeros/7.5/all_packages-x86-7.5.zip
          cp all_packages-x86-7.5.zip output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RouterOS-7.5-Install-Image
          path: output/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v7.5-img-${{ github.run_id }}
          name: RouterOS 7.5 Install Image (IMG Format)
          body: "Auto-built RouterOS 7.5 x86 install-image (.img) package."
          files: |
            output/install-image-7.5.zip
            output/all_packages-x86-7.5.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
