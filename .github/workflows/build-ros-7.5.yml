name: Build and Release RouterOS 7.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Download, Patch & Build RouterOS 7.5 Install Image
        env:
          MIKRO_NPK_SIGN_PUBLIC_KEY: "C293CED638A2A33C681FC8DE98EE26C54EADC5390C2DFCE197D35C83C416CF59"
          MIKRO_NPK_SIGN_PUBLIC_LKEY: "C293CED638A2A33C681FC8DE98EE26C54EADC5390C2DFCE197D35C83C416CF59"
          MIKRO_LICENSE_PUBLIC_KEY: "8E1067E4305FCDC0CFBF95C10F96E5DFE8C49AEF486BD1A4E2E96C27F01E3E32"
          CUSTOM_NPK_SIGN_PRIVATE_KEY: "3D9475D0383B26FFB5C1EBC7E580DD4FBF2342BA9F091015E35190D80C24CDA7"
          CUSTOM_NPK_SIGN_PUBLIC_KEY: "9BA63F05E55C293AFA9D961F9C43675D990252A158358986F5BB699700014709"
          CUSTOM_LICENSE_PRIVATE_KEY: "4C833571F03D04AF3D1EAA2D0BF102FDA565C777467E8FB97243498C872ACC01"
          CUSTOM_LICENSE_PUBLIC_KEY: "52AC2A5C0DC7D1405E96EA6965A17BAA13C2A6EA010A567B9216A3A6F7970462"
          MIKRO_UPGRADE_URL: "https://upgrade.mikrotik.com/"
          CUSTOM_UPGRADE_URL: "http://127.0.0.1/my_custom_upgrade/"
        run: |
          mkdir -p output
          mkdir -p pkgs_temp

          echo "=== 1. 下载官方 RouterOS 7.5 源文件 ==="
          wget -q --show-progress https://download.mikrotik.com/routeros/7.5/install-image-7.5.zip
          wget -q --show-progress https://download.mikrotik.com/routeros/7.5/all_packages-x86-7.5.zip

          echo "=== 2. 解压文件 ==="
          unzip -o install-image-7.5.zip
          unzip -o all_packages-x86-7.5.zip -d pkgs_temp/

          echo "=== 3. 针对所有 NPK 文件进行修补与重新签名 ==="
          cd pkgs_temp
          for f in *.npk; do
            if [ -f "$f" ]; then
              echo "[Processing NPK]: $f"
              python3 ../patch.py npk "$f"
              python3 ../npk.py sign "$f" "$f"
            fi
          done
          cd ..

          echo "=== 4. 针对安装镜像 (.img) 进行内核与引导修补 ==="
          IMG_FILE=$(ls install-image-*.img 2>/devnull | head -n 1)
          if [ -f "$IMG_FILE" ]; then
            python3 patch_img.py "$IMG_FILE"
          else
            echo "[ERROR]: 未找到 $IMG_FILE"
            exit 1
          fi

          echo "=== 5. 打包最终产物 ==="
          cd pkgs_temp
          zip -r ../output/all_packages-x86-7.5.zip *.npk
          cd ..

          zip -j output/install-image-7.5.zip "$IMG_FILE"

          echo "=== 构建完成！产物确认： ==="
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RouterOS-7.5-Patched-x86
          path: output/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v7.5-patched-${{ github.run_id }}
          name: RouterOS 7.5 Patched Release (x86)
          body: "Auto-built and patched RouterOS 7.5 x86 image."
          files: |
            output/install-image-7.5.zip
            output/all_packages-x86-7.5.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
