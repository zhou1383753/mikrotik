name: Build and Release RouterOS 7.5

on:
  workflow_dispatch: # 支持在 GitHub 网页上手动点击运行
  push:
    tags:
      - 'v*' # 只要推送 v1.0 等标签就会自动触发

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget zip unzip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download & Patch RouterOS 7.5 Packages
        run: |
          mkdir -p output

          # 1. 下载官方 RouterOS 7.5 镜像和扩展包
          wget -q https://download.mikrotik.com/routeros/7.5/chr-7.5.img.zip
          wget -q https://download.mikrotik.com/routeros/7.5/all_packages-x86-7.5.zip

          # 2. 解压并运行仓库中的 Patch 补丁/Keygen 脚本进行修补
          unzip chr-7.5.img.zip
          # 如果你的仓库包含破解/修改脚本 (如 patch.py / mikro.py 等)，在此调用执行：
          python3 patch.py chr-7.5.img || true
          
          # 3. 重新压缩打包成指定名称
          zip output/chr-7.5.img.zip chr-7.5.img
          cp all_packages-x86-7.5.zip output/all_packages-x86-7.5.zip

      - name: Upload Artifacts (Actions 页面下载)
        uses: actions/upload-artifact@v4
        with:
          name: RouterOS-7.5-Patched
          path: output/*

    - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v7.5-patched-${{ github.run_id }} # 自动生成唯一的 Tag 名
          name: RouterOS 7.5 Patched Release
          files: |
            output/chr-7.5.img.zip
            output/all_packages-x86-7.5.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
