name: Build and Release RouterOS 7.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Validate build environment
        env:
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          echo "=== Checking required files ==="
          test -f patch.py
          test -f npk.py

          echo "=== Checking required secrets ==="
          test -n "$CUSTOM_NPK_SIGN_PRIVATE_KEY" || { echo "ERROR: GitHub Secret CUSTOM_NPK_SIGN_PRIVATE_KEY is not configured"; exit 1; }
          test -n "$CUSTOM_LICENSE_PRIVATE_KEY" || { echo "ERROR: GitHub Secret CUSTOM_LICENSE_PRIVATE_KEY is not configured"; exit 1; }

          echo "=== Checking Python syntax ==="
          python3 -m py_compile patch.py npk.py

      - name: Download, Patch & Build RouterOS 7.5 Install Image
        env:
          MIKRO_NPK_SIGN_PUBLIC_KEY: "C293CED638A2A33C681FC8DE98EE26C54EADC5390C2DFCE197D35C83C416CF59"
          MIKRO_NPK_SIGN_PUBLIC_LKEY: "C293CED638A2A33C681FC8DE98EE26C54EADC5390C2DFCE197D35C83C416CF59"
          MIKRO_LICENSE_PUBLIC_KEY: "8E1067E4305FCDC0CFBF95C10F96E5DFE8C49AEF486BD1A4E2E96C27F01E3E32"
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          CUSTOM_NPK_SIGN_PUBLIC_KEY: "9BA63F05E55C293AFA9D961F9C43675D990252A158358986F5BB699700014709"
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
          CUSTOM_LICENSE_PUBLIC_KEY: "52AC2A5C0DC7D1405E96EA6965A17BAA13C2A6EA010A567B9216A3A6F7970462"
          MIKRO_UPGRADE_URL: "https://upgrade.mikrotik.com/"
          CUSTOM_UPGRADE_URL: "http://127.0.0.1/my_custom_upgrade/"
        run: |
          set -euo pipefail

          rm -rf output pkgs_temp install-image-7.5.img install-image-7.5.zip all_packages-x86-7.5.zip img_mnt
          mkdir -p output pkgs_temp img_mnt

          echo "=== 1. Download official RouterOS 7.5 source files ==="
          wget --retry-connrefused --waitretry=5 --tries=5 --timeout=30 --show-progress \
            https://download.mikrotik.com/routeros/7.5/install-image-7.5.zip
          wget --retry-connrefused --waitretry=5 --tries=5 --timeout=30 --show-progress \
            https://download.mikrotik.com/routeros/7.5/all_packages-x86-7.5.zip

          test -s install-image-7.5.zip
          test -s all_packages-x86-7.5.zip

          echo "=== 2. Extract files ==="
          unzip -o install-image-7.5.zip
          unzip -o all_packages-x86-7.5.zip -d pkgs_temp/
          test -s install-image-7.5.img

          echo "=== 3. Patch and re-sign all NPK files ==="
          shopt -s nullglob
          npk_files=(pkgs_temp/*.npk)
          test "${#npk_files[@]}" -gt 0

          for f in "${npk_files[@]}"; do
            echo "[Processing NPK]: $f"
            python3 patch.py npk "$f"
            python3 npk.py sign "$f" "$f"
          done

          echo "=== 4. Mount IMG, Patch Kernel via patch.py kernel ==="
          LOOP_DEV=$(sudo losetup -fP --show install-image-7.5.img)
          
          if [ -b "${LOOP_DEV}p1" ]; then
            sudo mount "${LOOP_DEV}p1" img_mnt
          else
            sudo mount "${LOOP_DEV}" img_mnt
          fi

          KERNEL_PATH=""
          if [ -f "img_mnt/boot/bzImage" ]; then
            KERNEL_PATH="img_mnt/boot/bzImage"
          elif [ -f "img_mnt/bzImage" ]; then
            KERNEL_PATH="img_mnt/bzImage"
          fi

          if [ -n "$KERNEL_PATH" ]; then
            echo "[Found Kernel]: $KERNEL_PATH"
            sudo python3 patch.py kernel "$KERNEL_PATH"
            echo "[Kernel patched successfully!]"
          else
            echo "ERROR: Kernel file (bzImage) not found inside img_mnt"
            exit 1
          fi

          sudo umount img_mnt
          sudo losetup -d "$LOOP_DEV"

          echo "=== 5. Package final files ==="
          cd pkgs_temp
          zip -r ../output/all_packages-x86-7.5.zip ./*.npk
          cd ..

          zip -j output/install-image-7.5.zip install-image-7.5.img

          echo "=== 6. Verify output files ==="
          test -s output/install-image-7.5.zip
          test -s output/all_packages-x86-7.5.zip
          ls -lh output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RouterOS-7.5-Patched-x86
          path: output/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.5-patched-${{ github.run_id }}
          name: RouterOS 7.5 Patched Release (x86)
          body: |
            Auto-built and patched RouterOS 7.5 x86 image.
            Workflow run: ${{ github.run_id }}
          files: |
            output/install-image-7.5.zip
            output/all_packages-x86-7.5.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
