name: Build and Release RouterOS 7.5

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget zip unzip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Download & Prepare RouterOS 7.5 Packages
        run: |
          mkdir -p output

          # 下载官方 RouterOS 7.5 镜像和扩展包
          wget -q https://download.mikrotik.com/routeros/7.5/chr-7.5.img.zip
          wget -q https://download.mikrotik.com/routeros/7.5/all_packages-x86-7.5.zip

          # 解压 img 镜像
          unzip -o chr-7.5.img.zip

          # 如果有修补需求，按正确的参数调用 patch.py（避免非法参数报错）
          if [ -f "patch.py" ]; then
            python3 patch.py netinstall chr-7.5.img || true
          fi

          # 重新打包到 output 目录
          zip -j output/chr-7.5.img.zip chr-7.5.img
          cp all_packages-x86-7.5.zip output/all_packages-x86-7.5.zip

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RouterOS-7.5-Packages
          path: output/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v7.5-${{ github.run_id }}
          name: RouterOS 7.5 Release
          body: "Auto-built RouterOS 7.5 packages."
          files: |
            output/chr-7.5.img.zip
            output/all_packages-x86-7.5.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
