name: Build and Release RouterOS 6.48.6 mipsbe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate
        env:
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -f patch.py
          test -f npk.py
          test -n "${CUSTOM_NPK_SIGN_PRIVATE_KEY}"
          test -n "${CUSTOM_LICENSE_PRIVATE_KEY}"
          python3 -m py_compile patch.py npk.py

      - name: Fix patch.py (lzma + no logo)
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path("patch.py")
          t = p.read_text(encoding="utf-8")

          start = t.find("def patch_initrd_xz(")
          end = t.find("\ndef find_7zXZ_data(", start)
          if start < 0 or end < 0:
              raise SystemExit("patch_initrd_xz not found")
          if "PRESET_EXTREME" in t[start:end] and "candidates" in t[start:end]:
              print("patch_initrd_xz already enhanced")
          else:
              new_fn = (
                  "def patch_initrd_xz(initrd_xz:bytes,key_dict:dict,ljust=True):\n"
                  "    initrd = lzma.decompress(initrd_xz)\n"
                  "    new_initrd = initrd\n"
                  "    for old_public_key,new_public_key in key_dict.items():\n"
                  "        if old_public_key in new_initrd:\n"
                  "            print(f'initrd public key patched {old_public_key[:16].hex().upper()}...')\n"
                  "            new_initrd = new_initrd.replace(old_public_key,new_public_key)\n"
                  "    candidates = []\n"
                  "    trials = [\n"
                  "        (9 | lzma.PRESET_EXTREME, 32*1024*1024, 4, 0, 0),\n"
                  "        (9 | lzma.PRESET_EXTREME, 32*1024*1024, 3, 0, 2),\n"
                  "        (9 | lzma.PRESET_EXTREME, 16*1024*1024, 3, 0, 2),\n"
                  "        (9 | lzma.PRESET_EXTREME, 8*1024*1024, 3, 0, 2),\n"
                  "        (9 | lzma.PRESET_EXTREME, 4*1024*1024, 3, 0, 2),\n"
                  "        (9, 8*1024*1024, 3, 0, 2),\n"
                  "        (9, None, None, None, None),\n"
                  "        (8, None, None, None, None),\n"
                  "        (7, None, None, None, None),\n"
                  "        (6, None, None, None, None),\n"
                  "    ]\n"
                  "    for preset, dict_size, lc, lp, pb in trials:\n"
                  "        filt = {'id': lzma.FILTER_LZMA2, 'preset': preset}\n"
                  "        if dict_size is not None:\n"
                  "            filt['dict_size'] = dict_size\n"
                  "        if lc is not None:\n"
                  "            filt['lc'] = lc\n"
                  "            filt['lp'] = lp\n"
                  "            filt['pb'] = pb\n"
                  "        try:\n"
                  "            out = lzma.compress(new_initrd, check=lzma.CHECK_CRC32, filters=[filt])\n"
                  "            candidates.append(out)\n"
                  "            print(f'trial size={len(out)}')\n"
                  "        except Exception as e:\n"
                  "            print('trial failed:', e)\n"
                  "    if not candidates:\n"
                  "        raise RuntimeError('no compress candidates')\n"
                  "    new_initrd_xz = min(candidates, key=len)\n"
                  "    print(f'new initrd xz size:{len(new_initrd_xz)}')\n"
                  "    print(f'old initrd xz size:{len(initrd_xz)}')\n"
                  "    if len(new_initrd_xz) > len(initrd_xz):\n"
                  "        raise AssertionError(\n"
                  "            f'new initrd xz size is too big: new={len(new_initrd_xz)} old={len(initrd_xz)}'\n"
                  "        )\n"
                  "    if ljust:\n"
                  "        print(f'ljust size:{len(initrd_xz)-len(new_initrd_xz)}')\n"
                  "        new_initrd_xz = new_initrd_xz.ljust(len(initrd_xz), bytes([0]))\n"
                  "    return new_initrd_xz\n"
                  "\n"
              )
              t = t[:start] + new_fn + t[end:]

          t = t.replace(
              "mksquashfs {extract_dir} {squashfs_file} -quiet -comp xz -Xbcj mips -no-xattrs -b 256k",
              "mksquashfs {extract_dir} {squashfs_file} -quiet -comp xz -no-xattrs -b 256k",
          )
          for frag in [
              "logo = os.path.join(extract_dir,\"nova/lib/console/logo.txt\")",
              "run_shell_command(f\"sudo sed -i '1d' {logo}\")",
              "run_shell_command(f\"sudo sed -i '8s#.*#  elseif@live.cn     https://github.com/elseif/MikroTikPatch#' {logo}\")",
          ]:
              if frag in t:
                  t = t.replace(frag, "pass  # logo patch disabled", 1)

          p.write_text(t, encoding="utf-8")
          print("patch.py fixed")
          PY
          python3 -m py_compile patch.py

      - name: Build mipsbe packages + option
        env:
          MIKRO_NPK_SIGN_PUBLIC_KEY: "C293CED638A2A33C681FC8DE98EE26C54EADC5390C2DFCE197D35C83C416CF59"
          MIKRO_NPK_SIGN_PUBLIC_LKEY: "C293CED638A2A33C681FC8DE98EE26C54EADC5390C2DFCE197D35C83C416CF59"
          MIKRO_LICENSE_PUBLIC_KEY: "8E1067E4305FCDC0CFBF95C10F96E5DFE8C49AEF486BD1A4E2E96C27F01E3E32"
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          CUSTOM_NPK_SIGN_PUBLIC_KEY: "9BA63F05E55C293AFA9D961F9C43675D990252A158358986F5BB699700014709"
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
          CUSTOM_LICENSE_PUBLIC_KEY: "52AC2A5C0DC7D1405E96EA6965A17BAA13C2A6EA010A567B9216A3A6F7970462"
          MIKRO_UPGRADE_URL: "https://upgrade.mikrotik.com/"
          CUSTOM_UPGRADE_URL: "http://127.0.0.1/my_custom_upgrade/"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools

          VERSION="6.48.6"
          ARCH="mipsbe"
          WORK="$PWD/build"
          OUT="$PWD/output"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/pkgs" "$WORK/option-root/bin" "$OUT"

          # ========== 1) 下载官方包 ==========
          wget --retry-connrefused --waitretry=5 --tries=5 --timeout=60 --show-progress \
            -O "$WORK/routeros-${ARCH}-${VERSION}.npk" \
            "https://download.mikrotik.com/routeros/${VERSION}/routeros-${ARCH}-${VERSION}.npk"
          wget --retry-connrefused --waitretry=5 --tries=5 --timeout=60 --show-progress \
            -O "$WORK/all_packages-${ARCH}-${VERSION}.zip" \
            "https://download.mikrotik.com/routeros/${VERSION}/all_packages-${ARCH}-${VERSION}.zip"

          echo "Official routeros size: $(stat -c%s "$WORK/routeros-${ARCH}-${VERSION}.npk") bytes"
          unzip -o "$WORK/all_packages-${ARCH}-${VERSION}.zip" -d "$WORK/pkgs/"
          chmod -R u+w "$WORK/pkgs" "$WORK/routeros-${ARCH}-${VERSION}.npk"
          ls -lh "$WORK/pkgs/" | head -40

          # ========== 2) 尝试准备 mipsbe busybox（做 option）==========
          # FUjr/elseif 无 busybox_mipsbe；不能用 mmips busybox（指令集不同）
          OPTION_OK=0
          BB="$WORK/busybox_mipsbe"
          # 尝试若干常见静态 mips(big-endian) busybox 来源
          for url in \
            "https://busybox.net/downloads/binaries/1.31.0-defconfig-multiarch-musl/busybox-mips" \
            "https://busybox.net/downloads/binaries/1.30.0-defconfig-multiarch/busybox-mips" \
            "https://github.com/andrew-d/static-binaries/raw/master/binaries/linux/mips/busybox"
          do
            echo "try busybox: $url"
            if wget -nv -O "$BB" "$url" 2>/dev/null && [ -s "$BB" ]; then
              chmod +x "$BB" || true
              file "$BB" || true
              # 粗检：ELF + MIPS
              if file "$BB" | grep -qiE "MIPS|ELF"; then
                OPTION_OK=1
                echo "busybox candidate OK: $url"
                break
              fi
            fi
            rm -f "$BB"
          done

          if [ "$OPTION_OK" = "1" ]; then
            cp "$BB" "$WORK/option-root/bin/busybox"
            chmod +x "$WORK/option-root/bin/busybox"

            # 命令列表：优先用 x86 busybox --list 仅取名字
            wget -nv -O "$WORK/busybox_x86" \
              "https://raw.githubusercontent.com/FUjr/MikroTikPatch/main/busybox/busybox_x86" || true
            COMMANDS=""
            if [ -x "$WORK/busybox_x86" ]; then
              chmod +x "$WORK/busybox_x86"
              COMMANDS=$("$WORK/busybox_x86" --list 2>/dev/null || true)
            fi
            if [ -z "$COMMANDS" ]; then
              COMMANDS="sh ash ls cat cp mv rm mkdir echo grep find vi tar gzip head tail free df ps kill"
            fi
            for cmd in $COMMANDS; do
              ln -sf /pckg/option/bin/busybox "$WORK/option-root/bin/$cmd"
            done
            ln -sf /pckg/option/bin/busybox "$WORK/option-root/bin/sh"
            ln -sf /pckg/option/bin/busybox "$WORK/option-root/bin/ash"

            mksquashfs "$WORK/option-root" "$WORK/option.sfs" \
              -no-recovery -noappend -exit-on-error -quiet \
              -comp xz -no-xattrs -b 256k -all-root
            ls -lh "$WORK/option.sfs"

            TEMPLATE=""
            for cand in \
              "$WORK/pkgs/gps-${VERSION}-${ARCH}.npk" \
              "$WORK/pkgs/ntp-${VERSION}-${ARCH}.npk" \
              "$WORK/pkgs/ups-${VERSION}-${ARCH}.npk"
            do
              [ -f "$cand" ] && TEMPLATE="$cand" && break
            done
            if [ -z "$TEMPLATE" ]; then
              TEMPLATE=$(ls "$WORK"/pkgs/*.npk | grep -vE 'system|routeros' | head -1)
            fi
            echo "option template: $TEMPLATE"
            OPTION_NPK="$WORK/pkgs/option-${VERSION}-${ARCH}.npk"
            python3 npk.py create "$TEMPLATE" "$OPTION_NPK" option "$WORK/option.sfs" -desc="busybox"
            python3 npk.py sign "$OPTION_NPK" "$OPTION_NPK"
            ls -lh "$OPTION_NPK"
            echo "OPTION_BUILT=1" >> "$GITHUB_ENV"
          else
            echo "WARN: no usable mipsbe busybox, skip option package"
            echo "OPTION_BUILT=0" >> "$GITHUB_ENV"
          fi

          # ========== 3) patch 主包（与成功的 mmips 一致）==========
          echo "[Processing main]: routeros-${ARCH}-${VERSION}.npk"
          python3 patch.py npk "$WORK/routeros-${ARCH}-${VERSION}.npk"
          python3 npk.py sign "$WORK/routeros-${ARCH}-${VERSION}.npk" "$WORK/routeros-${ARCH}-${VERSION}.npk"

          # ========== 4) all_packages：只 sign（FUjr 非 x86 风格）；option 已签过 ==========
          for f in "$WORK"/pkgs/*.npk; do
            base=$(basename "$f")
            if [[ "$base" == routeros-* ]]; then
              continue
            fi
            if [[ "$base" == option-* ]]; then
              echo "[SKIP sign again]: $base"
              continue
            fi
            echo "[SIGN]: $base"
            python3 npk.py sign "$f" "$f"
          done

          FINAL="$WORK/routeros-${ARCH}-${VERSION}.npk"
          SIZE=$(stat -c%s "$FINAL")
          echo "Final routeros size: $SIZE bytes"
          # 官网约 12MB
          if [ "$SIZE" -lt 8000000 ]; then
            echo "ERROR: final package too small"
            exit 1
          fi

          cp -f "$FINAL" "$OUT/routeros-${ARCH}-${VERSION}.npk"
          if [ -f "$WORK/pkgs/option-${VERSION}-${ARCH}.npk" ]; then
            cp -f "$WORK/pkgs/option-${VERSION}-${ARCH}.npk" "$OUT/option-${VERSION}-${ARCH}.npk"
          fi
          (cd "$WORK/pkgs" && zip -r "$OUT/all_packages-${ARCH}-${VERSION}.zip" ./*.npk)

          echo "=== outputs ==="
          ls -lh "$OUT/"
          unzip -l "$OUT/all_packages-${ARCH}-${VERSION}.zip" | grep -i option || echo "(no option in zip)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RouterOS-6.48.6-Patched-mipsbe
          path: output/*
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.48.6-mipsbe-patched-${{ github.run_id }}
          name: RouterOS 6.48.6 stable mipsbe
          body: |
            RouterOS 6.48.6 mipsbe patched (same method as working mmips).

            Assets:
            - routeros-mipsbe-6.48.6.npk  (main, ~12MB)
            - all_packages-mipsbe-6.48.6.zip
            - option-6.48.6-mipsbe.npk (if busybox available)

            Netinstall: patched Netinstall + only main routeros-mipsbe package first.
            Install option later via WinBox if present.

            Note: FUjr has no official busybox_mipsbe; option uses best-effort static mips busybox.
          files: |
            output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
