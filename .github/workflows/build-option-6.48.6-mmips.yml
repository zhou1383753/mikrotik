name: Build option-6.48.6-mmips (FUjr-safe)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate
        env:
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -f npk.py
          test -n "${CUSTOM_NPK_SIGN_PRIVATE_KEY}"
          test -n "${CUSTOM_LICENSE_PRIVATE_KEY}"
          python3 -m py_compile npk.py

      - name: Build option (FUjr mksquashfs style)
        env:
          CUSTOM_NPK_SIGN_PRIVATE_KEY: ${{ secrets.CUSTOM_NPK_SIGN_PRIVATE_KEY }}
          CUSTOM_LICENSE_PRIVATE_KEY: ${{ secrets.CUSTOM_LICENSE_PRIVATE_KEY }}
          CUSTOM_NPK_SIGN_PUBLIC_KEY: "9BA63F05E55C293AFA9D961F9C43675D990252A158358986F5BB699700014709"
          CUSTOM_LICENSE_PUBLIC_KEY: "52AC2A5C0DC7D1405E96EA6965A17BAA13C2A6EA010A567B9216A3A6F7970462"
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools

          VERSION="6.48.6"
          ARCH="mmips"
          WORK="$PWD/build"
          OUT="$PWD/output"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK/pkgs" "$WORK/option-root/bin" "$OUT"

          wget --retry-connrefused --waitretry=5 --tries=5 --timeout=60 --show-progress \
            -O "$WORK/all_packages-${ARCH}-${VERSION}.zip" \
            "https://download.mikrotik.com/routeros/${VERSION}/all_packages-${ARCH}-${VERSION}.zip"
          unzip -o "$WORK/all_packages-${ARCH}-${VERSION}.zip" -d "$WORK/pkgs/"
          chmod -R u+w "$WORK/pkgs"

          # busybox：优先仓库内，否则拉 FUjr
          if [ -f busybox/busybox_mmips ]; then
            cp busybox/busybox_mmips "$WORK/busybox_mmips"
          else
            wget -nv -O "$WORK/busybox_mmips" \
              "https://raw.githubusercontent.com/FUjr/MikroTikPatch/main/busybox/busybox_mmips"
          fi
          chmod +x "$WORK/busybox_mmips"
          file "$WORK/busybox_mmips"
          # 体积异常小基本是下载失败/HTML
          BB_SIZE=$(stat -c%s "$WORK/busybox_mmips")
          echo "busybox size: $BB_SIZE"
          if [ "$BB_SIZE" -lt 100000 ]; then
            echo "ERROR: busybox too small"
            exit 1
          fi

          sudo cp "$WORK/busybox_mmips" "$WORK/option-root/bin/busybox"
          sudo chmod +x "$WORK/option-root/bin/busybox"

          # 与 FUjr 一致：用 x86 busybox --list 生成软链名
          if [ -f busybox/busybox_x86 ]; then
            chmod +x busybox/busybox_x86
            COMMANDS=$(./busybox/busybox_x86 --list)
          else
            wget -nv -O "$WORK/busybox_x86" \
              "https://raw.githubusercontent.com/FUjr/MikroTikPatch/main/busybox/busybox_x86"
            chmod +x "$WORK/busybox_x86"
            COMMANDS=$("$WORK/busybox_x86" --list)
          fi
          for cmd in $COMMANDS; do
            sudo ln -sf /pckg/option/bin/busybox "$WORK/option-root/bin/$cmd"
          done

          # ★ 关键：与 FUjr 完全一致，不要 -all-root / -no-recovery 等
          sudo mksquashfs "$WORK/option-root" "$WORK/option.sfs" \
            -quiet -comp xz -no-xattrs -b 256k
          ls -lh "$WORK/option.sfs"
          sudo rm -rf "$WORK/option-root"

          # 模板：同版本 mmips 小包
          TEMPLATE=""
          for cand in \
            "$WORK/pkgs/gps-${VERSION}-${ARCH}.npk" \
            "$WORK/pkgs/ntp-${VERSION}-${ARCH}.npk" \
            "$WORK/pkgs/ups-${VERSION}-${ARCH}.npk"
          do
            [ -f "$cand" ] && TEMPLATE="$cand" && break
          done
          if [ -z "$TEMPLATE" ]; then
            TEMPLATE=$(ls "$WORK"/pkgs/*.npk | grep -vE 'system|routeros' | head -1)
          fi
          echo "template: $TEMPLATE"
          test -f "$TEMPLATE"
          ls -lh "$TEMPLATE"

          OPTION_NPK="$OUT/option-${VERSION}-${ARCH}.npk"
          python3 npk.py create "$TEMPLATE" "$OPTION_NPK" option "$WORK/option.sfs" -desc="busybox"
          python3 npk.py sign "$OPTION_NPK" "$OPTION_NPK"

          # 简单检查
          OPT_SIZE=$(stat -c%s "$OPTION_NPK")
          echo "option size: $OPT_SIZE"
          if [ "$OPT_SIZE" -lt 50000 ] || [ "$OPT_SIZE" -gt 8000000 ]; then
            echo "WARN: option size unusual: $OPT_SIZE"
          fi
          ls -lh "$OPTION_NPK"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: option-6.48.6-mmips
          path: output/option-6.48.6-mmips.npk
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v6.48.6-mmips-option-${{ github.run_id }}
          name: option-6.48.6-mmips (FUjr-safe)
          body: |
            option only for existing working 6.48.6 mmips main package.
            mksquashfs flags aligned with FUjr (no -all-root).

            Install ONLY after system boots normally:
            WinBox upload → Packages enable → one reboot.
            If reboot loop again: Netinstall main package only, skip option.
          files: |
            output/option-6.48.6-mmips.npk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
